[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "finmodel-app"
version = "0.0.1"
description = "Custom Excel financial models from a validated brief"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openpyxl>=3.1,<3.2",
    "pydantic>=2.7,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["engine*", "app*", "worker*", "adapters*"]

[tool.setuptools.package-data]
engine = ["briefs/*.json"]
app = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py", "templates/*.html"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["poc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "libreoffice: needs soffice (LibreOffice) on PATH",
    "browser: drives Chromium through Playwright",
]

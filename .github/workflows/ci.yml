name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui fonts-liberation
          soffice --version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node version (the calculator parity test runs web/static/calc.js and fails in CI without node)
        run: node --version
      - name: Install package
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        env:
          REQUIRE_LIBREOFFICE: "1"
          REQUIRE_BROWSER: "1"
        # LibreOffice and challenger runs dominate; spread them over the runner's cores (serial run > 20 min)
        run: pytest -q -n auto

  audit:
    # known vulnerabilities in the exact runtime versions the image installs (E17)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r constraints.txt --no-deps --disable-pip

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finmodel-app:ci .
      - name: Smoke test inside the image (generate, recalc, challenge)
        run: |
          docker run --rm finmodel-app:ci sh -c '
            python -m engine.build engine/briefs/cafe.json /tmp/cafe.xlsx &&
            python -m engine.recalc /tmp/cafe.xlsx &&
            python -m engine.challenger engine/briefs/cafe.json /tmp/cafe.xlsx > /tmp/report.json &&
            grep -q "\"verdict\": \"PASS\"" /tmp/report.json'

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Start the stack (production image + Postgres 16)
        run: docker compose up --build --wait
      - name: Install test dependencies
        run: pip install -c constraints.txt -e ".[dev]"
      - name: End to end against the stack
        env:
          COMPOSE_BASE_URL: http://localhost:8000
        run: pytest -q -m compose tests/test_compose_e2e.py
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color app | tail -n 200
      - name: Stop the stack
        if: always()
        run: docker compose down -v

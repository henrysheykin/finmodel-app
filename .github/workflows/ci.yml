name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui fonts-liberation
          soffice --version
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        env:
          REQUIRE_LIBREOFFICE: "1"
          REQUIRE_BROWSER: "1"
        run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t finmodel-app:ci .
      - name: Smoke test inside the image (generate, recalc, challenge)
        run: |
          docker run --rm finmodel-app:ci sh -c '
            python -m engine.build engine/briefs/cafe.json /tmp/cafe.xlsx &&
            python -m engine.recalc /tmp/cafe.xlsx &&
            python -m engine.challenger engine/briefs/cafe.json /tmp/cafe.xlsx > /tmp/report.json &&
            grep -q "\"verdict\": \"PASS\"" /tmp/report.json'

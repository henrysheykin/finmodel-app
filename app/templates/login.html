{% extends "base.html" %}
{% block title %}Sign in — StartupModel{% endblock %}
{% block main %}
<div class="narrow">
  <h1>Sign in</h1>
  <p class="lead">Enter the email you used at checkout. We'll send a one-time sign-in link — no password.</p>
  {% if error %}<div class="errors" role="alert"><p>{{ error|capitalize }}.</p></div>{% endif %}
  <form method="post" action="/login" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" maxlength="254" value="{{ email }}">
    </div>
    <button class="btn" type="submit">Email me a sign-in link</button>
  </form>
</div>
{% endblock %}
